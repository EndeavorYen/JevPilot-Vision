[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevpilot-vision"
version = "0.2.0"
description = "JevPilot-Vision: 3D driving application, perception pipeline, and trajectory sampling for SemArbiter"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]
neural = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jevpilot_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
