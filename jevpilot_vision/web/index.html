<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0d14" />
    <meta
      name="description"
      content="Playable 3D autonomous driving simulator powered by local SemArbiter."
    />
    <title>SemArbiter JevPilot — Autonomous Driving Simulator (RTX 5080 · 12ms)</title>
    <style>
      #scene-loader{z-index:1000;color:#f1f5f9;text-align:center;background:#0a0d14;place-content:center;justify-items:center;gap:16px;padding:24px;font:14px system-ui,sans-serif;display:grid;position:fixed;inset:0}
      #scene-loader[hidden],#scene-loader [hidden]{display:none}
      #scene-loader strong{font-size:20px;font-weight:700;color:#38bdf8}
      #scene-loader p{color:#94a3b8;margin:0}
      .loading-spinner{border:2px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;width:26px;height:26px;animation:.9s linear infinite loading-spin}
      #loading-retry{color:#fff;cursor:pointer;background:#0284c7;border:0;border-radius:8px;padding:12px 18px}
      @keyframes loading-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.loading-spinner{animation:none}}
    </style>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        window.SEMIF_RAW_MODE = q.get("raw") === "1" || q.get("rawMode") === "1";
        var seed = q.get("seed");
        window.SEMIF_SEED = seed && isFinite(Number(seed)) ? Number(seed) : null;
        // Map size (junctions per side) for Skyline City and Small town. Free driving uses the
        // larger 7 x 7 grid; a benchmark lap (lap=1) keeps the 5 x 5 grid its published scores
        // were measured on. ?size=3..9 overrides both.
        var size = Number(q.get("size"));
        if (!(size >= 3 && size <= 9)) size = q.get("lap") === "1" ? 5 : 7;
        size = Math.round(size);
        window.SEMIF_MAP = { size: size, cityTraffic: 28 + (size - 5) * 6, townTraffic: 14 + (size - 5) * 4 };
        // Free driving opens on the Solmare coast; a benchmark lap keeps its published map.
        var start = q.get("start");
        var starts = ["festival", "harbour", "coast", "pass", "highway"];
        window.SEMIF_DEFAULT_WORLD = q.get("lap") === "1" ? null : "coast:" + (starts.indexOf(start) >= 0 ? start : "festival");
        var proto = HTMLCanvasElement.prototype;
        var origGetContext = proto.getContext;
        proto.getContext = function (kind, attrs) {
          if (kind === "webgl" || kind === "webgl2" || kind === "experimental-webgl") {
            var next = Object.assign({}, attrs || {});
            next.preserveDrawingBuffer = true;
            return origGetContext.call(this, kind, next);
          }
          return origGetContext.call(this, kind, attrs);
        };
      })();
    </script>
    <link rel="stylesheet" href="/jevpilot/semif-layer.css?v=20261002b" />
    <script src="/jevpilot/semif-worldgen.js?v=20261002l"></script>
    <script type="module" src="/jevpilot/semif-world/index.js?v=20261002c"></script>
    <script type="module" crossorigin src="/jevpilot/assets/index-DC8fTtby.js?v=20261002l"></script>
    <script src="/jevpilot/semif-telemetry.js?v=20261002a"></script>
    <script src="/jevpilot/semif-stats.js?v=20261002b"></script>
    <script src="/jevpilot/semif-scenery.js?v=20260929a"></script>
    <script src="/jevpilot/semif-layer.js?v=20261002l" defer></script>
  </head>
  <body class="loading">
    <div id="scene-loader" role="status" aria-live="polite">
      <strong>⚡ Loading SemArbiter JevPilot…</strong>
      <p id="loading-message">Preparing the map…</p>
      <span class="loading-spinner" aria-hidden="true"></span>
      <button id="loading-retry" hidden>Try again</button>
    </div>
    <div id="app" inert aria-busy="true"></div>
  </body>
</html>
