<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f2433" />
    <meta
      name="description"
      content="Solmare Drive: an open-world Mediterranean coast where a local SemArbiter drives, from the simulator or from its own cameras."
    />
    <title>Solmare Drive — autonomous driving on the coast</title>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        window.SEMIF_RAW_MODE = q.get("raw") === "1" || q.get("rawMode") === "1";
        var seed = q.get("seed");
        window.SEMIF_SEED = seed && isFinite(Number(seed)) ? Number(seed) : null;
        // Map size (junctions per side) for Skyline City and Small town. Free driving uses the
        // larger 7 x 7 grid; a benchmark lap (lap=1) keeps the 5 x 5 grid its published scores
        // were measured on. ?size=3..9 overrides both.
        var size = Number(q.get("size"));
        if (!(size >= 3 && size <= 9)) size = q.get("lap") === "1" ? 5 : 7;
        size = Math.round(size);
        window.SEMIF_MAP = { size: size, cityTraffic: 28 + (size - 5) * 6, townTraffic: 14 + (size - 5) * 4 };
        // Free driving opens on the Solmare coast; a benchmark lap keeps its published map.
        var start = q.get("start");
        var starts = ["festival", "harbour", "coast", "pass", "highway"];
        window.SEMIF_DEFAULT_WORLD = q.get("lap") === "1" ? null : "coast:" + (starts.indexOf(start) >= 0 ? start : "festival");
        var proto = HTMLCanvasElement.prototype;
        var origGetContext = proto.getContext;
        proto.getContext = function (kind, attrs) {
          if (kind === "webgl" || kind === "webgl2" || kind === "experimental-webgl") {
            var next = Object.assign({}, attrs || {});
            next.preserveDrawingBuffer = true;
            return origGetContext.call(this, kind, next);
          }
          return origGetContext.call(this, kind, attrs);
        };
      })();
    </script>
    <link rel="stylesheet" href="/jevpilot/semif-layer.css?v=20261003h1" />
    <script src="/jevpilot/semif-loader.js?v=20261003b" defer></script>
    <script src="/jevpilot/semif-worldgen.js?v=20261003h1"></script>
    <script type="module" src="/jevpilot/semif-world/index.js?v=20261003h3"></script>
    <script type="module" crossorigin src="/jevpilot/assets/index-DC8fTtby.js?v=20261003h1"></script>
    <script src="/jevpilot/semif-telemetry.js?v=20261002a"></script>
    <script src="/jevpilot/semif-stats.js?v=20261003b"></script>
    <script src="/jevpilot/semif-scenery.js?v=20260929a"></script>
    <script src="/jevpilot/semif-vision-pace.js?v=20261003p2"></script>
    <script src="/jevpilot/semif-capture.js?v=20261003s2"></script>
    <script src="/jevpilot/semif-layer.js?v=20261003s2" defer></script>
  </head>
  <body class="loading">
    <div id="scene-loader" role="status" aria-live="polite" data-state="loading">
      <span class="sol-sun" aria-hidden="true"></span>
      <span class="sol-glint" aria-hidden="true"></span>
      <div class="sol-loader-card">
        <div class="sol-wordmark">
          <strong>Solmare</strong>
          <span>Drive</span>
        </div>
        <p id="loading-message">Preparing the map…</p>
        <div class="sol-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        <span class="sol-progress-label" aria-hidden="true">0%</span>
        <button id="loading-retry" hidden>Try again</button>
      </div>
    </div>
    <div id="app" inert aria-busy="true"></div>
  </body>
</html>
